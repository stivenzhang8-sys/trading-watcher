# Scheduled workflows in public repos are disabled after 60 days without repository activity.
# Monthly: re-enable the workflows through the API and push a one-line timestamp commit.
name: keepalive
on:
  schedule:
    - cron: '37 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Re-enable workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable watcher.yml -R "$GITHUB_REPOSITORY"
          gh workflow enable keepalive.yml -R "$GITHUB_REPOSITORY"
      - name: Keepalive commit
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive $(date -u +%Y-%m)" && git push || echo "nothing to commit"
